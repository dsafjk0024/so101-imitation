# Follower arm: broadcasts joint states + accepts absolute position commands via a
# forward_command_controller. Unified 6-joint (gripper is a position joint), matching
# the dataset action contract (6-D absolute joint positions incl gripper).
# Runs under the /follower namespace, so params nest under `follower:`.
follower:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      forward_controller:
        type: forward_command_controller/ForwardCommandController

  forward_controller:
    ros__parameters:
      joints:
        - shoulder_pan
        - shoulder_lift
        - elbow_flex
        - wrist_flex
        - wrist_roll
        - gripper
      interface_name: position
