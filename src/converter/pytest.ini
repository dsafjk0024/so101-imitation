[pytest]
# Put the package on sys.path via pytest rather than the PYTHONPATH env var:
# PYTHONPATH already carries /opt/ros/jazzy/lib/python3.12/site-packages, and
# overriding it would hide rosbag2_py from Seam 3. ../../act adds the
# standalone `act` package (and its `tools/`) for Seam 1's training path.
pythonpath = . ../../act

markers =
    slow: runs a real AV1 encode; deselect with -m "not slow"
