[pytest]
# `inference` lives here; `converter` (obs contract) is a sibling ROS package
# under ../converter — add both to sys.path via pytest, not PYTHONPATH (see
# src/converter/pytest.ini for why: PYTHONPATH already carries the ROS site-
# packages and must stay untouched). ../../act adds the standalone `act`
# package the policy-loading code in sync_inference_node.py imports.
pythonpath = . ../converter ../../act
